AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Birthday Email Automator - full backend. Creates the DynamoDB table, both
  Lambdas, the HTTP API, the Cognito sign-in, the daily schedule, and the IAM
  roles. Everything is
  serverless and pay-per-request, so an idle stack costs nothing.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Required" }
        Parameters: [SignInEmail, SignInDomainPrefix, AppUrl, AllowedOrigin, FromAddress, SesIdentity, ToAddresses]
      - Label: { default: "Optional" }
        Parameters: [SecondSignInEmail, FromName, TimeZone, ReminderHour, LogRetentionDays]
    ParameterLabels:
      SignInEmail: { default: "Email of the first person who can sign in" }
      SecondSignInEmail: { default: "Email of a second person who can sign in" }
      SignInDomainPrefix: { default: "Prefix for the Cognito sign-in page address" }
      SesIdentity: { default: "SES identity the sender address belongs to" }
      FromAddress: { default: "Verified SES sender address" }
      ToAddresses: { default: "Who receives the reminders" }
      AllowedOrigin: { default: "Exact URL the app is served from" }
      AppUrl: { default: "Full URL of the app page" }

Parameters:
  SignInEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: >
      Signs in with a one-time code emailed here. Sign-in is invite-only: the
      only accounts are the ones this template creates, and nobody can
      register. Must be deliverable from SES - in the sandbox that means a
      verified address.

  SecondSignInEmail:
    Type: String
    Default: ""
    Description: Optional. A second person who shares the same birthday list.

  SignInDomainPrefix:
    Type: String
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: >
      The sign-in page is served at https://<prefix>.auth.<region>.amazoncognito.com.
      Must be unique within the region and cannot contain "aws", "amazon" or
      "cognito".

  SesIdentity:
    Type: String
    Description: >
      The verified SES identity that FromAddress belongs to - usually its
      domain (yourdomain.com), or the address itself if you verified just that.
      Cognito sends the sign-in codes through it.

  FromAddress:
    Type: String
    Description: >
      Reminders are sent from here. MUST already be verified in SES in this
      region, and should be a domain you control - sending as a @gmail.com
      address will land in spam because Gmail's DMARC policy rejects it.

  ToAddresses:
    Type: String
    Description: Comma-separated list of addresses that receive the reminder.

  AllowedOrigin:
    Type: String
    MinLength: 8
    AllowedPattern: '^https?://[^*\s]+$'
    ConstraintDescription: >
      Must be one exact origin such as https://yourname.github.io. "*" is not
      accepted.
    Description: >
      The single origin the app is served from, e.g. https://yourname.github.io.
      This used to default to "*", which let any website on the internet call
      this API from a visitor's browser.

  AppUrl:
    Type: String
    AllowedPattern: '^https://[^*\s]+$'
    Description: >
      The exact page the app is served from, e.g.
      https://yourname.github.io/birthday-reminder-gifting-app/. Cognito only
      sends people back to this URL after sign-in. Also the footer link in the
      reminder email.

  FromName:
    Type: String
    Default: ""
    Description: >
      Optional. Signs the birthday card sent to friends ("- Matt"). Leave
      blank to send the card unsigned. Has no effect on the household
      reminder.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 3653]
    Description: >
      How long to keep Lambda logs. Without this CloudWatch keeps them forever,
      which is both a slow-growing bill and an ever-growing copy of who is in
      your address book.

  TimeZone:
    Type: String
    Default: America/Chicago
    Description: '"7 days before" is counted in this timezone, not UTC.'

  ReminderHour:
    Type: Number
    Default: 8
    MinValue: 0
    MaxValue: 23
    Description: Hour of day (0-23, in TimeZone) to send the reminder.

Conditions:
  HasSecondUser: !Not [!Equals [!Ref SecondSignInEmail, ""]]

Resources:
  # ── Storage ────────────────────────────────────────────────────────────
  FriendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-friends"
      # On-demand: no capacity to plan, and a household list bills as ~nothing.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: ownerId,  AttributeType: S }
        - { AttributeName: friendId, AttributeType: S }
      KeySchema:
        - { AttributeName: ownerId,  KeyType: HASH }
        - { AttributeName: friendId, KeyType: RANGE }
      # Sweeps the "already sent this reminder" markers after ~13 months.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # DynamoDB encrypts at rest by default; saying so explicitly means a
      # future edit that drops it shows up as a diff rather than a silence.
      SSESpecification:
        SSEEnabled: true

  # ── Sign-in ────────────────────────────────────────────────────────────
  # Cognito's hosted page with a one-time code emailed to you. Invite-only:
  # the users below are the only accounts, and nobody can register.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      # Email one-time codes need the Essentials tier; it is free for the
      # first 10,000 monthly active users.
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
        # PASSWORD cannot be left out of this list. Nobody is ever told a
        # password (see the SetPasswordCommand output), so the emailed code is
        # the only way in in practice.
        SignInPolicy:
          AllowedFirstAuthFactors: [PASSWORD, EMAIL_OTP]
      # Cognito will only send one-time codes through your own SES identity.
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentity}"
        From: !Ref FromAddress
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      # A static page cannot keep a secret; it uses PKCE instead.
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref AppUrl]
      LogoutURLs: [!Ref AppUrl]
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # One-hour access tokens, renewed silently for a year from the refresh
      # token, so the household signs in about once a year per device.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref SignInDomainPrefix
      # Version 2 is the newer hosted page; the classic one cannot do
      # passwordless sign-in.
      ManagedLoginVersion: 2

  SignInBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  # Created with no invitation email. They start in FORCE_CHANGE_PASSWORD,
  # which Cognito does not allow to sign in with an emailed code - run the
  # SetPasswordCommand output once per user after the stack is up.
  FirstUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref SignInEmail
      MessageAction: SUPPRESS
      UserAttributes:
        - { Name: email, Value: !Ref SignInEmail }
        - { Name: email_verified, Value: "true" }

  SecondUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasSecondUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref SecondSignInEmail
      MessageAction: SUPPRESS
      UserAttributes:
        - { Name: email, Value: !Ref SecondSignInEmail }
        - { Name: email_verified, Value: "true" }

  # ── Shared Lambda role ─────────────────────────────────────────────────
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AppAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Scoped to this stack's table only.
              - Sid: FriendsTableOnly
                Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem,
                         dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem]
                Resource: !GetAtt FriendsTable.Arn
              - Sid: SendRemindersOnly
                Effect: Allow
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource: "*"
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref FromAddress

  # ── Functions ──────────────────────────────────────────────────────────
  # Code is loaded from the published bundle so the template stays readable.
  # See deploy/README.md for how to point these at your own build.
  ApiFunction:
    Type: AWS::Lambda::Function
    # Without this Lambda races the template and creates its own log group
    # with no retention on first invoke.
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      # A public endpoint with no ceiling is a billing incident waiting to
      # happen. Ten concurrent executions is far more than a household needs
      # and puts a hard floor under a runaway.
      ReservedConcurrentExecutions: 10
      Role: !GetAtt AppRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref FriendsTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          export const handler = async () => ({
            statusCode: 500,
            body: JSON.stringify({
              error: "Placeholder. Deploy the real bundle - see deploy/README.md step 3.",
            }),
          });

  ReminderFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReminderLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-reminder"
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      # One scheduled run a day never needs more than one at a time.
      ReservedConcurrentExecutions: 2
      Role: !GetAtt AppRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref FriendsTable
          FROM_ADDRESS: !Ref FromAddress
          TO_ADDRESSES: !Ref ToAddresses
          TZ_NAME: !Ref TimeZone
          APP_URL: !Ref AppUrl
          FROM_NAME: !Ref FromName
      Code:
        ZipFile: |
          export const handler = async () => ({
            statusCode: 500,
            body: JSON.stringify({
              error: "Placeholder. Deploy the real bundle - see deploy/README.md step 3.",
            }),
          });

  # ── Logs ───────────────────────────────────────────────────────────────
  # Declared here rather than left to Lambda's implicit creation, so retention
  # is set from the first invocation. Reminder logs contain names and dates of
  # real people; keeping them forever by default is a quiet data-retention
  # problem as much as a cost one.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: !Ref LogRetentionDays

  ReminderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-reminder"
      RetentionInDays: !Ref LogRetentionDays

  # ── HTTP API ───────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, PUT, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 3600

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  # Checks the Cognito access token before the Lambda runs. A request without
  # a valid token from this pool and client never reaches the function.
  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
        Audience: [!Ref UserPoolClient]

  # Explicit routes rather than $default: an authorizer on $default also
  # applies to the browser's CORS preflight, which carries no token, so every
  # request from the app would fail before it started.
  FriendsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /friends
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub "integrations/${ApiIntegration}"

  FriendsPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /friends
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub "integrations/${ApiIntegration}"

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # Unauthenticated requests are rejected before the Lambda runs, but they
      # still count as API calls. This caps what a stranger hammering the
      # endpoint can cost you.
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  # ── Daily schedule ─────────────────────────────────────────────────────
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeReminder
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderFunction.Arn

  DailyReminder:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-daily-reminder"
      Description: Runs the birthday reminder once a day.
      FlexibleTimeWindow: { Mode: "OFF" }
      ScheduleExpression: !Sub "cron(0 ${ReminderHour} * * ? *)"
      ScheduleExpressionTimezone: !Ref TimeZone
      Target:
        Arn: !GetAtt ReminderFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  ApiEndpoint:
    Description: Put this in index.html as the API constant.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  SignInDomain:
    Description: Put this in index.html as AUTH_DOMAIN, and add it to connect-src in the page's CSP.
    Value: !Sub "https://${SignInDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  SignInClientId:
    Description: Put this in index.html as AUTH_CLIENT.
    Value: !Ref UserPoolClient
  SetPasswordCommand:
    Description: >
      Run once per sign-in email (swap in the second address). Sets a random
      password nobody is told, which moves the user out of FORCE_CHANGE_PASSWORD
      so the emailed code works.
    Value: !Sub "aws cognito-idp admin-set-user-password --region ${AWS::Region} --user-pool-id ${UserPool} --permanent --username ${SignInEmail} --password \"$(openssl rand -base64 24)Aa1\""
  TableName:
    Value: !Ref FriendsTable
  ReminderFunctionName:
    Description: Deploy your reminder bundle here.
    Value: !Ref ReminderFunction
  ApiFunctionName:
    Description: Deploy your API bundle here.
    Value: !Ref ApiFunction
  NextStep:
    Value: "Upload the two Lambda bundles - see deploy/README.md step 3."
